<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>飛書登入 · 簽單台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">簽單台<span>.</span></div>
    <div class="login-eyebrow">業務簽單管理系統</div>
    <h1>使用飛書帳號登入</h1>
    <p class="login-intro">以公司的飛書帳號進入，集中管理客戶、合同與業績。</p>
    {% if message %}<div class="login-message" role="alert">{{ message }}</div>{% endif %}
    {% if tenant_candidate %}
    <div class="login-tenant">
      <label for="tenant-key">此次飛書驗證的企業識別碼</label>
      <input id="tenant-key" class="input" readonly value="{{ tenant_candidate }}" aria-describedby="tenant-help">
      <p id="tenant-help">管理員確認是公司企業後，將此值填入設定檔的 FEISHU_TENANT_KEY，再重新啟動系統。</p>
    </div>
    {% endif %}
    {% if ready %}
    <a class="btn btn-primary login-button" data-testid="feishu-login" href="{{ url_for('feishu_start', next=next_path) }}">使用飛書登入 <span aria-hidden="true">↗</span></a>
    {% else %}
    <button class="btn btn-primary login-button" disabled>等待管理員完成設定</button>
    {% endif %}
    {% if system_url %}<a class="login-home" href="{{ system_url }}">返回系統首頁</a>{% endif %}
    <div class="login-footer">僅開放公司授權人員使用。登入後可查看團隊共用資料。</div>
  </main>
</body>
</html>
