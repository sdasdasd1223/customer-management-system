name: signing-system
services:
  signing:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIGNING_HOST_PORT:-8000}:8000"
    volumes:
      - signing_data:/data
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://127.0.0.1:8000/auth/feishu/callback}
      FEISHU_SESSION_HOURS: ${FEISHU_SESSION_HOURS:-8}
volumes:
  signing_data:
